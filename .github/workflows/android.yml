name: android

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: android

jobs:
  build:
    name: lint, test, assemble
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad  # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      # Caches Gradle dependencies and validates gradle-wrapper.jar against Gradle's checksums.
      # The runner image provides the Android SDK (ANDROID_HOME); AGP fetches missing packages.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6  # v6.4.0
        with:
          validate-wrappers: true

      - name: Lint, unit tests, debug APK, ktlint, detekt
        run: ./gradlew lint testDebugUnitTest assembleDebug ktlintCheck detekt --console=plain

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: android-reports-${{ github.run_id }}
          path: android/**/build/reports/
          retention-days: 7
