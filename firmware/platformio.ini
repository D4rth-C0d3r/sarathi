; sārathi firmware. Versions and board settings are pinned to Elecrow's tested toolchain;
; see "Board configuration" in CLAUDE.md. Upgrade only in a dedicated PR, after testing on
; the device.

[platformio]
; Plain `pio run` builds the device. The native env is for `pio test -e native` only.
default_envs = crowpanel21

[env:crowpanel21]
; ESP32 Arduino core 3.3.8 (ESP-IDF 5.5.4), as required by Elecrow's LVGL rotary guide.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38/platform-espressif32.zip
framework = arduino
; Arduino IDE "ESP32S3 Dev Module", with the overrides below.
board = esp32-s3-devkitc-1
; Flash 16MB, QIO 80MHz.
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.f_flash = 80000000L
; CPU 240MHz.
board_build.f_cpu = 240000000L
; OPI PSRAM.
board_build.arduino.memory_type = qio_opi
; Our own table (two 6 MB OTA slots), not Elecrow's elecrow_s3.csv.
board_build.partitions = partitions.csv
upload_speed = 921600
; Native USB CDC, so the baud rate is nominal.
monitor_speed = 115200
; esp32_exception_decoder truncates the start of log lines; use it only to decode a crash:
;   pio device monitor -f esp32_exception_decoder
monitor_filters = direct
; The platform passes both -std=gnu++2a and -std=gnu++2b; drop both so C++17 applies.
build_unflags =
    -std=gnu++2a
    -std=gnu++2b
build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    ; USB CDC On Boot enabled, USB mode Hardware CDC and JTAG.
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; ESP_LOGI and above.
    -DCORE_DEBUG_LEVEL=3
    ; LVGL picks up include/lv_conf.h.
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude
; Versions confirmed in vendor/crowpanel-2.1/example/Arduino/libraries/*/library.properties.
lib_deps =
    lvgl/lvgl@9.1.0
    moononournation/GFX Library for Arduino@1.6.7
    adafruit/Adafruit CST8XX Library@1.1.1
    adafruit/Adafruit BusIO@1.16.2
    xreef/PCF8574 library@2.3.7
; `pio test -e crowpanel21` runs only the on-device tests; the rest are host tests.
test_filter = test_device_*

[env:crowpanel21-test]
; On-device tests with the network test enabled (test/test_device_*). Wi-Fi comes from your shell
; at build time and is never committed:
;   export SARATHI_WIFI_SSID='...' SARATHI_WIFI_PASSWORD='...'
;   pio test -e crowpanel21-test
; The test firmware replaces the app: run `pio run -e crowpanel21 -t upload` afterwards.
extends = env:crowpanel21
build_flags =
    ${env:crowpanel21.build_flags}
    ; Each whole flag is single-quoted so values with spaces stay one flag.
    '-DSARATHI_TEST_WIFI_SSID="${sysenv.SARATHI_WIFI_SSID}"'
    '-DSARATHI_TEST_WIFI_PASSWORD="${sysenv.SARATHI_WIFI_PASSWORD}"'

[env:crowpanel21-chronos]
; The device with the Chronos app as its phone link instead of the demo ride (ADR-0005,
; docs/phase3-findings.md). Phone setup: docs/building.md. Interim until our own app (Phase 4):
; deleting this env, the #if branch in src/main.cpp and sarathi_link/chronos_* removes it.
extends = env:crowpanel21
build_flags =
    ${env:crowpanel21.build_flags}
    -DSARATHI_BACKEND_CHRONOS
lib_deps =
    ${env:crowpanel21.lib_deps}
    fbiego/ChronosESP32@1.9.1
    h2zero/NimBLE-Arduino@2.5.1
    fbiego/ESP32Time@2.0.6

[env:sim]
; Desktop simulator: the same sarathi_ui code on LVGL's SDL2 driver, 480x480 with a round
; mask. `--chronos` feeds it through sarathi_link's Chronos receiver (its device part is built
; only with -DSARATHI_BACKEND_CHRONOS). Needs libsdl2-dev (docs/building.md). Build: `pio run -e sim`;
; build and run: `pio run -e sim -t exec`. Uses the compiler's default C++ standard
; (gnu++17 on GCC 11+), because a -std flag here would also reach LVGL's C sources.
platform = native
build_src_filter = -<*> +<../sim/>
build_flags =
    -DSARATHI_SIM
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude
    ; board_pins.h only (header-only constants); the rest of sarathi_board is ignored.
    -Ilib/sarathi_board
    -lSDL2
lib_deps =
    lvgl/lvgl@9.1.0
    ; Local, for --chronos; the dependency finder doesn't look in ../sim for it.
    sarathi_link
lib_ignore =
    sarathi_board
    sarathi_ota
    sarathi_settings

[env:native]
; Host unit tests for sarathi_core, sarathi_proto and the pure parts of sarathi_link (the
; Chronos packet receiver and bridge). No hardware libraries.
platform = native
test_framework = unity
build_flags =
    -std=c++17
    -Wall
    -Wextra
    -Werror
    ; Golden OTA manifest vectors (docs/ota/manifest.md), read at test time.
    -DSARATHI_OTA_VECTORS_DIR=\"$PROJECT_DIR/../docs/ota/vectors\"
lib_ignore =
    sarathi_board
    sarathi_ota
    sarathi_settings
    sarathi_ui
test_ignore = test_device_*
