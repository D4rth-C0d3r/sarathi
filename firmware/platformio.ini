; sārathi firmware. Versions and board settings are pinned to Elecrow's tested toolchain;
; see "Board configuration" in CLAUDE.md. Upgrade only in a dedicated PR, after testing on
; the device.

[platformio]
; Plain `pio run` builds the device. The native env is for `pio test -e native` only.
default_envs = crowpanel21

[env:crowpanel21]
; ESP32 Arduino core 3.3.8 (ESP-IDF 5.5.4), as required by Elecrow's LVGL rotary guide.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38/platform-espressif32.zip
framework = arduino
; Arduino IDE "ESP32S3 Dev Module", with the overrides below.
board = esp32-s3-devkitc-1
; Flash 16MB, QIO 80MHz.
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.f_flash = 80000000L
; CPU 240MHz.
board_build.f_cpu = 240000000L
; OPI PSRAM.
board_build.arduino.memory_type = qio_opi
; Our own table (two 6 MB OTA slots), not Elecrow's elecrow_s3.csv.
board_build.partitions = partitions.csv
upload_speed = 921600
; Native USB CDC, so the baud rate is nominal.
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; The platform passes both -std=gnu++2a and -std=gnu++2b; drop both so C++17 applies.
build_unflags =
    -std=gnu++2a
    -std=gnu++2b
build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    ; USB CDC On Boot enabled, USB mode Hardware CDC and JTAG.
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; ESP_LOGI and above.
    -DCORE_DEBUG_LEVEL=3
    ; LVGL picks up include/lv_conf.h.
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude
; Versions confirmed in vendor/crowpanel-2.1/example/Arduino/libraries/*/library.properties.
lib_deps =
    lvgl/lvgl@9.1.0
    moononournation/GFX Library for Arduino@1.6.7
    adafruit/Adafruit CST8XX Library@1.1.1
    adafruit/Adafruit BusIO@1.16.2
    xreef/PCF8574 library@2.3.7

[env:native]
; Host unit tests for sarathi_core and sarathi_proto. No hardware libraries.
platform = native
test_framework = unity
build_flags =
    -std=c++17
    -Wall
    -Wextra
    -Werror
lib_ignore =
    sarathi_board
    sarathi_link
    sarathi_ota
    sarathi_settings
    sarathi_ui
